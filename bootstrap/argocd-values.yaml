global:
  domain: argocd.fiduce.local
configs:
  params:
    server.insecure: false
  cm:
    admin.enabled: true
    timeout.reconciliation: 180s
    resource.exclusions: |
      - apiGroups: ["wgpolicyk8s.io", "reports.kyverno.io"]
        kinds: ["*"]
        clusters: ["*"]
  rbac:
    policy.default: role:readonly

  dex:
    enabled: false

  controller:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
  repoServer:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  server:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  redis:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }
  applicationSet:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
  notifications:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
